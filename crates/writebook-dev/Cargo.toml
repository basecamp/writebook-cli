[package]
name = "writebook-dev"
description = "bin/dev's commands: lint the code, review a branch, run the tests"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "writebook-dev"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.9"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
regex = "1"
usage = { version = "6", package = "usage-rs" }

[lints]
workspace = true

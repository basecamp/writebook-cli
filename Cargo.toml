[package]
name = "writebook-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "writebook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
diffy = "0.4"
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
usage = { version = "6", package = "usage-rs", features = ["completions"] }

# The code reads better with these, so CI's `cargo clippy -D warnings`
# leaves them alone.
[lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
too_many_arguments = "allow"

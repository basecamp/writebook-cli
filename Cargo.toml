[package]
name = "writebook-cli"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "writebook"
path = "src/main.rs"

[dependencies]
anyhow = "1"
diffy = "0.4"
dirs = "6"
jaq-core = "3.1.2"
jaq-json = "2.0.3"
jaq-std = "3.0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "3", features = ["json"] }
usage = { version = "6", package = "usage-rs", features = ["completions"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The code reads better with these, so CI's `cargo clippy -D warnings`
# leaves them alone.
[lints.clippy]
collapsible_if = "allow"
collapsible_match = "allow"
too_many_arguments = "allow"

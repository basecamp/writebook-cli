name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A new push to a PR cancels the run on its old head.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The lints and every test, including tests/live.rs against the latest image of
  # basecamp/writebook main, seeded with tests/support/seed.rb.
  test:
    runs-on: ubuntu-latest
    services:
      writebook:
        image: ghcr.io/basecamp/writebook:main
        env:
          SECRET_KEY_BASE: ci-only-not-a-secret-0123456789abcdef0123456789abcdef0123456789abcdef
          DISABLE_SSL: "1"
        ports:
          - 3000:80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: bin/dev code lint
      - name: Wait for Writebook
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3000/up >/dev/null && exit 0
            sleep 2
          done
          echo "Writebook did not come up" >&2
          exit 1
      - name: Seed books
        run: docker exec -i "${{ job.services.writebook.id }}" bin/rails runner - < tests/support/seed.rb
      - run: bin/dev test run
        env:
          WRITEBOOK_LIVE_URL: http://localhost:3000

  # Windows has no file modes, so sign-ins are kept private with an access
  # list instead. These tests check that it names only you.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --profile ci --test sign_ins
